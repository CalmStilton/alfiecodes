# Runs on the AlfieCodes LXC (192.168.50.200) in /docker/alfiecodes/.
# Reached only through the LAN Caddy: https://alfiecodes.lan.lukmor.com
# Secrets live in .env next to this file (never in git): PASSWORD=
services:
  code-server:
    image: ghcr.io/calmstilton/alfiecodes:latest
    container_name: alfiecodes
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/London
      PASSWORD: ${PASSWORD}
      PROXY_DOMAIN: alfiecodes.lan.lukmor.com
      PREVIEW_URL: https://alfiepreview.lan.lukmor.com/
      DEFAULT_WORKSPACE: /config/workspace
    volumes:
      - ./config:/config
      - ./projects:/config/workspace
      - ./published:/published
    ports:
      - "8080:8443"
      - "8000:8000"   # try-out preview (publish --run), via Caddy as alfiepreview.lan.lukmor.com
    mem_limit: 2g
    memswap_limit: 2g

  # Public side: only /published, read-only. The Cloudflare Tunnel hostname
  # (alfie.lukmor.com) points at this port; the IDE is never behind the tunnel.
  published:
    image: nginx:alpine
    container_name: alfiecodes-published
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./published:/published:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:8081"
    mem_limit: 64m
