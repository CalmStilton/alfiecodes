# Serves /published (read-only) to the Cloudflare Tunnel. Static files only.
server {
    listen 8081;
    server_tokens off;
    root /published;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location / {
        try_files $uri $uri/ =404;
    }
    # arcade.json is publish metadata, not for visitors
    location = /arcade.json { return 404; }
    location ~ /arcade\.json$ { return 404; }
    location ~ /\. { return 404; }
}
