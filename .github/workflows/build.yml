name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"   # Mondays: pick up a newer code-server base
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/calmstilton/alfiecodes   # lowercase is required by GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test, push
        run: |
          docker build --pull --provenance=false --sbom=false -t "$IMAGE:latest" .
          docker run --rm --entrypoint python3 "$IMAGE:latest" \
            -c "import pygame, pygbag, numpy; print('pygame-ce', pygame.version.ver)"
          docker run --rm --entrypoint sh "$IMAGE:latest" -c "command -v pgzrun"
          docker push "$IMAGE:latest"
